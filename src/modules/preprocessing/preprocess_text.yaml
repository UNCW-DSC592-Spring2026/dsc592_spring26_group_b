$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: preprocess_text_custom
display_name: Preprocess Text (Custom Invoker)
version: "SET_BY_GITHUB_ACTIONS"
type: command

inputs:
  Dataset:
    type: uri_folder
    description: Input data
  Stop_words:
    type: uri_folder
    optional: true
    description: Optional custom list of stop words to remove
  Language:
    type: string
    default: "English"
  Text_column_to_clean:
    type: string
  Remove_stop_words:
    type: boolean
    default: true
  Use_lemmatization:
    type: boolean
    default: true
  Detect_sentences:
    type: boolean
    default: true
  Normalize_case_to_lowercase:
    type: boolean
    default: true
  Remove_numbers:
    type: boolean
    default: true
  Remove_special_characters:
    type: boolean
    default: true
  Remove_duplicate_characters:
    type: boolean
    default: true
  Remove_email_addresses:
    type: boolean
    default: true
  Remove_URLs:
    type: boolean
    default: true
  Expand_verb_contractions:
    type: boolean
    default: true
    optional: true
  Normalize_backslashes_to_slashes:
    type: boolean
    default: true
  Split_tokens_on_special_characters:
    type: boolean
    default: true
  Custom_regular_expression:
    type: string
    optional: true
  Custom_replacement_string:
    type: string
    optional: true
outputs:
  Results_dataset:
    type: uri_folder
code: ../../
environment: azureml:AzureML-Designer:89
command: >-
  python -m aml_shared.urldecode &&
  python -m azureml.studio.modulehost.module_invoker
  --module-name=azureml.studio.modules.text_analytics.preprocess_text.preprocess_text
  --dataset ${{inputs.Dataset}}
  --text-column-to-clean "${{inputs.Text_column_to_clean}}"
  --language "${{inputs.Language}}"
  --remove-stop-words ${{inputs.Remove_stop_words}}
  --use-lemmatization ${{inputs.Use_lemmatization}}
  --detect-sentences ${{inputs.Detect_sentences}}
  --normalize-case-to-lowercase ${{inputs.Normalize_case_to_lowercase}}
  --remove-numbers ${{inputs.Remove_numbers}}
  --remove-special-characters ${{inputs.Remove_special_characters}}
  --remove-duplicate-characters ${{inputs.Remove_duplicate_characters}}
  --remove-email-addresses ${{inputs.Remove_email_addresses}}
  --remove-ur-ls ${{inputs.Remove_URLs}}
  --normalize-backslashes-to-slashes ${{inputs.Normalize_backslashes_to_slashes}}
  --split-tokens-on-special-characters ${{inputs.Split_tokens_on_special_characters}}
  $[[--stop-words ${{inputs.Stop_words}}]]
  --results-dataset ${{outputs.Results_dataset}}

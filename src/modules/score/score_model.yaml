$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: score_model_custom
display_name: Score Model (Custom Invoker)
version: "SET_BY_GITHUB_ACTIONS"
type: command

inputs:
  Trained_model:
    type: uri_folder
    description: Trained predictive model (output from Train Model)
  Dataset:
    type: uri_folder
    description: Input test dataset for scoring
  Append_score_columns_to_output:
    type: boolean
    default: true
    description: If true, appends score columns to the result dataset.

outputs:
  Scored_dataset:
    type: uri_folder
    description: Dataset containing the obtained predictions/scores

code: ../../
environment: azureml:AzureML-Designer:89

command: >-
  python -m aml_shared.urldecode
  python -m azureml.studio.modules.ml.score.score_generic_module.score_generic_module
  --trained-model ${{inputs.Trained_model}}
  --dataset ${{inputs.Dataset}}
  --append-score-columns-to-output ${{inputs.Append_score_columns_to_output}}
  --scored-dataset ${{outputs.Scored_dataset}}
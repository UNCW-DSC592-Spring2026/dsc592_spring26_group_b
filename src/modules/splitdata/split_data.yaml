$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: split_data_custom
display_name: Split Data (Custom Invoker)
version: "SET_BY_GITHUB_ACTIONS"
type: command

inputs:
  Dataset:
    type: uri_folder
    description: Dataset to split
  Splitting_mode:
    type: string
    default: "Split Rows"
    description: "Method for splitting: Split Rows, Regular Expression, or Relative Expression"
  Fraction_of_rows_in_the_first_output_dataset:
    type: number
    default: 0.5
    description: Ratio for the first output dataset
  Randomized_split:
    type: boolean
    default: true
  Random_seed:
    type: integer
    default: 0
  Stratified_split:
    type: string
    default: "False"
  Stratification_key_column:
    type: string
    optional: true
  Regular_expression:
    type: string
    default: ""
    optional: true
  Relational_expression:
    type: string
    default: ""
    optional: true

outputs:
  Results_dataset1:
    type: uri_folder
    description: Dataset containing selected rows
  Results_dataset2:
    type: uri_folder
    description: Dataset containing all other rows

code: ../../
environment: azureml:AzureML-Designer:89

command: >-
  python -m aml_shared.urldecode
  python -m azureml.studio.modulehost.module_invoker
  --module-name=azureml.studio.modules.datatransform.split_data.split_data
  --dataset ${{inputs.Dataset}}
  --splitting-mode "${{inputs.Splitting_mode}}"
  --fraction-of-rows-in-the-first-output-dataset ${{inputs.Fraction_of_rows_in_the_first_output_dataset}}
  --randomized-split ${{inputs.Randomized_split}}
  --random-seed ${{inputs.Random_seed}}
  --stratified-split ${{inputs.Stratified_split}}
  --results-dataset1 ${{outputs.Results_dataset1}}
  --results-dataset2 ${{outputs.Results_dataset2}}

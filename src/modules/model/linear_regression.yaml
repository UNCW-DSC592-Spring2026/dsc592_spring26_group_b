$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: linear_regression_custom
display_name: Linear Regression (Custom Invoker)
version: "SET_BY_GITHUB_ACTIONS"
type: command

inputs:
  Solution_method:
    type: string
    default: "Ordinary Least Squares"
    description: "Optimization method: Ordinary Least Squares or Online Gradient Descent"
  L2_regularization_weight:
    type: number
    default: 0.001
  Include_intercept_term:
    type: boolean
    default: true
  # Online Gradient Descent specific parameters
  Create_trainer_mode:
    type: string
    default: "SingleParameter"
    optional: true
  Learning_rate:
    type: number
    default: 0.1
    optional: true
  Number_of_training_epochs:
    type: integer
    default: 10
    optional: true
  Normalize_features:
    type: boolean
    default: true
    optional: true
  Decrease_learning_rate:
    type: boolean
    default: true
    optional: true
  Random_number_seed:
    type: integer
    optional: true

outputs:
  Untrained_model:
    type: uri_folder
    description: An untrained regression model

code: ../../
environment: azureml:AzureML-Designer:89

command: >-
  python -m aml_shared.urldecode
  python -m azureml.studio.modules.ml.initialize_models.regressor.linear_regressor.linear_regressor
  --solution-method "${{inputs.Solution_method}}"
  --l2-regularization-weight ${{inputs.L2_regularization_weight}}
  --include-intercept-term ${{inputs.Include_intercept_term}}
  $[[--create-trainer-mode "${{inputs.Create_trainer_mode}}"]]
  $[[--learning-rate ${{inputs.Learning_rate}}]]
  $[[--number-of-epochs-over-which-algorithm-iterates-through-examples ${{inputs.Number_of_training_epochs}}]]
  $[[--should-input-instances-be-normalized ${{inputs.Normalize_features}}]]
  $[[--decrease-learning-rate-as-iterations-progress ${{inputs.Decrease_learning_rate}}]]
  $[[--random-number-seed ${{inputs.Random_number_seed}}]]
  --untrained-model ${{outputs.Untrained_model}}
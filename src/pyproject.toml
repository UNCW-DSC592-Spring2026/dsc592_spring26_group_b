[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsc592_groupb_aml_pipeline"
version = "0.1.0"
authors = [
    { name="Your Name", email="your.email@example.com" },
]
description = "A utility to invoke AzureML studio modules with runpy and urldecode support"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "azureml-core", # Required for the session ID logging
]

[project.scripts]
# This allows you to run the invoker from the command line directly
aml-invoke = "aml_shared.invoker:execute"
aml-decode-invoke = "aml_shared.urldecode:execute"

[tool.setuptools]
packages = ["aml_shared", "modules"]

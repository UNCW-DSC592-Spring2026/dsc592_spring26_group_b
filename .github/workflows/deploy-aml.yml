name: Azure ML Full Pipeline CI/CD

on:
  push:
    branches: [ baseline ]
    paths:
      - '**.yaml'
      - '**.py'
      - 'aml_shared/**'

jobs:
  deploy-and-run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install ML Extension
        run: az extension add -n ml
      - name: Purge Data from Workspace
        run: |
          # Remove large files that shouldn't be uploaded to Azure ML
          find . -name "*.csv" -delete
          find . -name "*.parquet" -delete
          rm -rf tests/ experiments/ docs/
      - name: Prepare and Register All Components
        run: |
          # 1. Define the dynamic version
          VERSION="1.0.${{ github.run_number }}"
          echo "DEPLOY_VERSION=$VERSION" >> $GITHUB_ENV

          # 2. Inject version into all Component and Job YAMLs
          find . -name "*.yaml" -exec sed -i "s/SET_BY_GITHUB_ACTIONS/$VERSION/g" {} +
          find . -name "run_pipeline.yaml" -exec sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" {} +
          echo "Registering all components with version: $VERSION"
          # Components to register
          COMPONENTS=("preprocess_text.yaml" "split_data.yaml" "linear_regression.yaml" "train_model.yaml" "score_model.yaml")

          for file_name in "${COMPONENTS[@]}"; do
            FILE_PATH=$(find . -name "$file_name")
            if [ -n "$FILE_PATH" ]; then
              echo "Attempting to register $file_name..."

              # Retry logic: Try up to 3 times
              SUCCESS=false
              for i in {1..3}; do
                if az ml component create --file "$FILE_PATH" \
                  --resource-group dsc592_spring26_group_b \
                  --workspace-name dsc592_spring26_group_b; then
                  SUCCESS=true
                  break
                else
                  echo "Attempt $i failed. Azure ML service might be busy. Retrying in 10s..."
                  sleep 10
                fi
              done

              if [ "$SUCCESS" = false ]; then
                echo "Failed to register $file_name after 3 attempts."
                exit 1
              fi
            fi
          done
         
      - name: Submit Full Pipeline Job
        run: |
          # Find the exact path for the pipeline job file
          PIPELINE_PATH=$(find . -name "run_pipeline.yaml")
          echo "Launching Full Pipeline from $PIPELINE_PATH..."

          az ml job create --file "$PIPELINE_PATH" \
            --resource-group dsc592_spring26_group_b \
            --workspace-name dsc592_spring26_group_b

name: Azure ML CI/CD

on:
  push:
    branches: [ baseline ]
    paths:
      - 'src/**' # Only trigger if code or configs change

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install ML Extension
        run: az extension add -n ml

      - name: Register Component with Dynamic Version
        run: |
          # Create a unique version using the GitHub Run ID (e.g., 1.0.42)
          VERSION="1.0.${{ github.run_number }}"

          # Swap the placeholder in the YAML
          sed -i "s/SET_BY_GITHUB_ACTIONS/$VERSION/g" src/modules/preprocessing/preprocess_text.yaml

          echo "Registering version: $VERSION"

          az ml component create --file src/modules/preprocessing/preprocess_text.yaml \
            --resource-group dsc592_spring26_group_b \
            --workspace-name dsc592_spring26_group_b

          # Store version for the next step
          echo "DEPLOY_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run Smoke Test Job
        run: |
          # Update the job file to use the version we just created
          # This looks for the component name and updates the version tag
          sed -i "s/preprocess_text_custom:.*/preprocess_text_custom:${{ env.DEPLOY_VERSION }}/g" src/modules/preprocessing/run_preprocess.yaml

          echo "Launching test job with version ${{ env.DEPLOY_VERSION }}..."

          az ml job create --file src/modules/preprocessing/run_preprocess.yaml \
            --resource-group dsc592_spring26_group_b \
            --workspace-name dsc592_spring26_group_b \
            --no-wait

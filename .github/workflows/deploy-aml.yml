name: Azure ML Full Pipeline CI/CD

on:
  push:
    branches: [ baseline ]
    paths:
      - '**.yaml'
      - '**.py'
      - 'aml_shared/**'

jobs:
  deploy-and-run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install ML Extension
        run: az extension add -n ml

      - name: Prepare and Register All Components
        run: |
          # 1. Define the dynamic version
          VERSION="1.0.${{ github.run_number }}"
          echo "DEPLOY_VERSION=$VERSION" >> $GITHUB_ENV

          # 2. Inject version into all Component and Job YAMLs
          find . -name "*.yaml" -exec sed -i "s/SET_BY_GITHUB_ACTIONS/$VERSION/g" {} +
          find . -name "run_full_pipeline.yaml" -exec sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" {} +

          echo "Registering all components with version: $VERSION"

          # 3. Loop through and register every component YAML
          # Assumes your component files are in the root or you can provide the path
          for file_name in preprocess_text.yaml split_data.yaml linear_regression.yaml train_model.yaml score_model.yaml; do
            FILE_PATH=$(find . -name "$file_name")
            if [ -n "$FILE_PATH" ]; then
              echo "Registering $file_name found at $FILE_PATH..."
              az ml component create --file "$FILE_PATH" \
                --resource-group dsc592_spring26_group_b \
                --workspace-name dsc592_spring26_group_b
            else
              echo "Warning: Could not find $file_name in the repository."
            fi
          done

      - name: Submit Full Pipeline Job
        run: |
          # Find the exact path for the pipeline job file
          PIPELINE_PATH=$(find . -name "run_pipeline.yaml")
          echo "Launching Full Pipeline from $PIPELINE_PATH..."

          az ml job create --file "$PIPELINE_PATH" \
            --resource-group dsc592_spring26_group_b \
            --workspace-name dsc592_spring26_group_b

name: Azure ML Full Pipeline CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/components/**'
      - 'src/pipeline.yml'

jobs:
  deploy-and-run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install ML Extension
        run: az extension add -n ml

      - name: Purge Data from Workspace
        run: |
          find . -name "*.csv" -delete
          find . -name "*.parquet" -delete
          rm -rf tests/ experiments/ docs/

      - name: Prepare and Register All Components
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "DEPLOY_VERSION=$VERSION" >> $GITHUB_ENV

          find . \( -name "*.yaml" -o -name "*.yml" \) \
            -exec sed -i "s/SET_BY_GITHUB_ACTIONS/$VERSION/g" {} +
          find . -name "pipeline.yml" \
            -exec sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" {} +

          COMPONENTS=("preprocess_text.yml" "split_data.yml" "train.yml" "score.yml")
          for file_name in "${COMPONENTS[@]}"; do
            FILE_PATH=$(find ./src/components -name "$file_name")
            if [ -n "$FILE_PATH" ]; then
              SUCCESS=false
              for i in {1..3}; do
                if az ml component create --file "$FILE_PATH" \
                  --resource-group dsc592_spring26_group_b \
                  --workspace-name dsc592_spring26_group_b; then
                  SUCCESS=true; break
                else
                  sleep 10
                fi
              done
              if [ "$SUCCESS" = false ]; then exit 1; fi
            fi
          done

      - name: Submit and Wait for Pipeline
        id: run_pipeline
        run: |
          # 1. Submit the job and capture the Run ID
          # Using a single line for the create command to ensure the query works
          RUN_NAME=$(az ml job create --file src/pipeline.yml --resource-group dsc592_spring26_group_b --workspace-name dsc592_spring26_group_b --query name -o tsv)
          
          echo "RUN_NAME=$RUN_NAME" >> $GITHUB_ENV
          echo "Job $RUN_NAME submitted successfully. Monitoring status..."
          
          # 2. Use a loop to poll the status if --wait continues to fail
          # This is the 'bulletproof' method for automation
          while true; do
            STATUS=$(az ml job show --name $RUN_NAME --resource-group dsc592_spring26_group_b --workspace-name dsc592_spring26_group_b --query status -o tsv)
            echo "Current Status: $STATUS"
            if [[ "$STATUS" == "Completed" || "$STATUS" == "Succeeded" ]]; then
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Canceled" ]]; then
              echo "Job failed or was canceled."
              exit 1
            fi
            sleep 30
          done
      - name: Download and Process Results
        if: success()
        run: |
          mkdir -p ./outputs
          
          echo "Downloading Scored Dataset..."
          # We use the top-level output name defined in pipeline.yml
          az ml job download --name ${{ env.RUN_NAME }} \
            --resource-group dsc592_spring26_group_b \
            --workspace-name dsc592_spring26_group_b \
            --output-name "final_pipeline_output" \
            --download-path ./outputs

          python -c "
          import pandas as pd
          import os
          import glob

          try:
              # Recursive search ensures we find it regardless of nested folder names
              files = glob.glob('./outputs/**/scored.csv', recursive=True)
              
              if not files:
                  print('CRITICAL: scored.csv not found.')
                  exit(1)
              
              df = pd.read_csv(files[0])
              mae = (df['reviewerRating'] - df['score']).abs().mean()
              avg_rating = df['reviewerRating'].mean()
              count = len(df)
              
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'TOTAL_REVIEWS={count}\n')
                  f.write(f'AVG_RATING={avg_rating:.4f}\n')
                  f.write(f'MAE={mae:.4f}\n')
              
              print(f'Processed {count} rows. MAE: {mae:.4f}')
          except Exception as e:
              print(f'Python Error: {e}')
              exit(1)
          "
      - name: Calculate Summary Metrics
        if: success()
        run: |
          python -c "
          import pandas as pd
          import os
          import glob
      
          try:
              # Search recursively for scored.csv inside the outputs folder
              search_path = './outputs/**/scored.csv'
              files = glob.glob(search_path, recursive=True)
              
              if not files:
                  print('Warning: Could not find scored.csv')
                  print('Files in outputs directory:')
                  for root, dirs, filenames in os.walk('./outputs'):
                      for f in filenames: 
                          print(os.path.join(root, f))
                  # Set default values if file not found
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write('TOTAL_REVIEWS=N/A\n')
                      f.write('AVG_RATING=N/A\n')
                      f.write('MAE=N/A\n')
                  exit(0)
              
              target_file = files[0]
              print(f'Found file at: {target_file}')
              
              df = pd.read_csv(target_file)
              
              # Calculate Metrics
              mae = (df['reviewerRating'] - df['score']).abs().mean()
              avg_rating = df['reviewerRating'].mean()
              count = len(df)
              
              # Write to GitHub Env
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'TOTAL_REVIEWS={count}\n')
                  f.write(f'AVG_RATING={avg_rating:.4f}\n')
                  f.write(f'MAE={mae:.4f}\n')
                  
              print('Metrics calculated and saved to ENV.')
          except Exception as e:
              print(f'Error: {e}')
              exit(1)
          "          
      - name: Send Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "Azure ML Bot"
          SLACK_ICON: https://raw.githubusercontent.com/microsoft/azure-pipelines-tasks/master/Tasks/AzureMonitorAlertsV0/icon.png
          SLACK_TITLE: "Azure ML Run: ${{ job.status }}"
          SLACK_MESSAGE: |
            *Version:* ${{ env.DEPLOY_VERSION }}
            *Run ID:* `${{ env.RUN_NAME }}`
            
            *--- Results Analysis ---*
            • *Total Reviews:* ${{ env.TOTAL_REVIEWS || 'N/A' }}
            • *Avg Actual Rating:* ${{ env.AVG_RATING || 'N/A' }}
            • *Mean Absolute Error:* ${{ env.MAE || 'N/A' }}
            
            *View Run in Studio:* https://ml.azure.com/runs/${{ env.RUN_NAME }}?wsid=/subscriptions/YOUR_SUB_ID/resourceGroups/dsc592_spring26_group_b/providers/Microsoft.MachineLearningServices/workspaces/dsc592_spring26_group_b
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
